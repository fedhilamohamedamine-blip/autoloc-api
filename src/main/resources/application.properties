spring.application.name=autoloc-api

# Connexion MariaDB. Remplacer ces valeurs via les variables d'environnement si nécessaire.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/autoloc_db1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Pilote JDBC & Dialecte
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
server.port=8082
